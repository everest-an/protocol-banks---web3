# Smithery.ai MCP Server Registry
# https://smithery.ai/docs/config
# Submit: smithery publish

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      MCP_AUTH_TOKEN:
        type: string
        description: "SIWE session JWT (optional; enables account tools)"
      MCP_WALLET_ADDRESS:
        type: string
        description: "Wallet address that owns the MCP_AUTH_TOKEN (optional)"
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["ts-node", "-r", "dotenv/config", "-r", "tsconfig-paths/register", "lib/mcp/stdio-server.ts"],
      env: {
        MCP_AUTH_TOKEN: config.MCP_AUTH_TOKEN || "",
        MCP_WALLET_ADDRESS: config.MCP_WALLET_ADDRESS || ""
      }
    })

name: protocol-banks
displayName: Protocol Banks
description: |
  Control plane for agent commerce: one credential, one server-enforced mandate
  across commerce, payments, cards and trading. Agents can discover services,
  accept quotes, deliver proof, pay through EIP-3009/x402, and trade through a
  trading-only Hyperliquid wallet.

  23 tools:
  - Commerce: list_agent_services, create_commerce_quote, accept_commerce_quote,
    deliver_commerce_order, complete_commerce_order, list_commerce_orders,
    get_agent_reputation
  - Trading: get_trading_overview, get_positions, get_activity,
    get_track_record, control_trading_agent
  - Payments: list_supported_tokens, get_payment_quote, estimate_gas,
    compare_chain_fees, create_payment, check_payment_status, list_payments,
    execute_payment, create_invoice, list_invoices, get_balance

  Authentication: SIWE (Sign-In with Ethereum) → JWT
  Docs: https://protocolbanks.com/llms-full.txt

tags:
  - agent-commerce
  - ai-agent
  - payments
  - stablecoin
  - web3
  - crypto
  - usdc
  - ethereum
  - base
  - defi
  - invoice
  - multi-chain
  - x402

category: finance
license: GPL-3.0-only
homepage: https://protocolbanks.com
repository: https://github.com/everest-an/protocol-banks---web3
