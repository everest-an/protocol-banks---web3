name: Release packages

# Publish @everestan/protocolbanks-sdk and @everestan/protocolbanks-agent-tools.
#
# Setup (once):
#   1. npm → Access Tokens → create a granular token with
#      "All packages: Read and write" (and "Bypass 2FA" if the account has 2FA).
#   2. GitHub → Settings → Secrets and variables → Actions → new secret
#      NPM_TOKEN = that token.
#   3. Bump the version in the package's package.json, push, then run this
#      workflow manually. It refuses to republish an existing version.
#
# The SDK is published before the tool manifest (the manifest peers on it).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which package to publish
        type: choice
        options: [both, sdk, agent-tools]
        default: both
      dry_run:
        description: Build and pack only (no publish)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build the SDK
        if: inputs.target != 'agent-tools'
        working-directory: packages/sdk
        run: |
          npm install --no-save --no-package-lock tsup@8 typescript@5
          npx tsup src/index.ts --format cjs,esm --dts

      - name: Build the tool manifest
        if: inputs.target != 'sdk'
        working-directory: packages/agent-tools
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps tsup@8 typescript@5
          npx tsup src/index.ts --format cjs,esm --dts

      - name: Pack the SDK
        if: inputs.dry_run
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Pack the tool manifest
        if: inputs.dry_run
        working-directory: packages/agent-tools
        run: npm pack --dry-run

      - name: Publish the SDK
        if: inputs.target != 'agent-tools' && !inputs.dry_run
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@everestan/protocolbanks-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@everestan/protocolbanks-sdk@$VERSION is already published — bump package.json first."
            exit 1
          fi
          npm publish --access public

      - name: Publish the tool manifest
        if: inputs.target != 'sdk' && !inputs.dry_run
        working-directory: packages/agent-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@everestan/protocolbanks-agent-tools@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@everestan/protocolbanks-agent-tools@$VERSION is already published — bump package.json first."
            exit 1
          fi
          npm publish --access public
