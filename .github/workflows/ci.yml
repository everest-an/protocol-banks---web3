name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + jest + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test --ci --runInBand
        env:
          NODE_ENV: test

      - name: Lint
        run: pnpm lint

      # The production build is the only gate that catches client/server
      # boundary mistakes (e.g. server-only modules pulled into client chunks,
      # which broke the Vercel build while tsc/jest/lint stayed green).
      - name: Production build
        run: pnpm build
        env:
          # Placeholders only — the build must not need real credentials.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AI_JWT_SECRET: ci-placeholder

  go-services:
    name: Go services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [payout-engine, event-indexer, webhook-handler]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  packages:
    name: Packages (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The two published packages are standalone (not a pnpm workspace), so
      # their builders are installed locally: tsup's dts step resolves
      # `typescript` from the package directory, not from an npx cache.
      - name: Build @everestan/protocolbanks-sdk
        working-directory: packages/sdk
        run: |
          npm install --no-save --no-package-lock tsup@8 typescript@5 @types/node@22
          npx tsup src/index.ts --format cjs,esm --dts

      - name: Build @everestan/protocolbanks-agent-tools
        working-directory: packages/agent-tools
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps tsup@8 typescript@5 @types/node@22
          npx tsup src/index.ts --format cjs,esm --dts

      - name: Verify the tarball contents
        run: |
          for pkg in packages/sdk packages/agent-tools; do
            for file in index.js index.mjs index.d.ts; do
              test -f "$pkg/dist/$file" || { echo "missing $pkg/dist/$file"; exit 1; }
            done
          done
          echo "both packages built with cjs + esm + dts"
