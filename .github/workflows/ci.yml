name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + jest + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: npx tsc --noEmit
        env:
          # The type graph outgrew the default 2 GB heap on a runner; 4 GB is
          # enough and still well under the 7 GB runner limit.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests
        run: pnpm test --ci --runInBand
        env:
          NODE_ENV: test

      - name: Lint
        run: pnpm lint

      # The production build is the only gate that catches client/server
      # boundary mistakes (e.g. server-only modules pulled into client chunks,
      # which broke the Vercel build while tsc/jest/lint stayed green).
      - name: Production build
        run: pnpm build
        env:
          # The build worker also needs more than the default 2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096
          # Placeholders only - the build must not need real credentials.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AI_JWT_SECRET: ci-placeholder

  agent-budget-integration:
    name: Agent budget atomicity (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protocol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Push schema to disposable Postgres
        run: pnpm prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/protocol_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/protocol_test

      - name: Budget atomicity
        run: pnpm test:db:budget
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/protocol_test

  go-services:
    name: Go services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [payout-engine, event-indexer, webhook-handler]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./...

