name: Point production domains to latest deployment

on:
  push:
    branches: [main]

jobs:
  point-domains:
    name: Re-point protocolbanks.com to the newest deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the new deployment and alias the domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_Da058QFCURMp71dIUxVaCVBXSjNX
        run: |
          set -euo pipefail
          START_MS=$(date +%s%3N)
          # Vercel creates the deployment on push a few seconds *before* this
          # action starts. Accept deployments created in the last 5 minutes so
          # we don't miss the one this push produced, while still avoiding
          # aliasing to a stale deployment from an earlier push.
          MIN_CREATED=$((START_MS - 300000))

          echo "Polling Vercel for the newest production (READY) deployment..."
          DEPLOY_URL=""
          for i in $(seq 1 96); do
            sleep 15
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&state=READY&limit=1")
            # The API returns newest-first. Take the single READY production
            # deployment whose createdAt falls inside the grace window.
            DEPLOY_URL=$(echo "$RESP" | MIN_CREATED="$MIN_CREATED" node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const dpl=(j.deployments||[])[0];if(!dpl)return console.log('');const created=Number(dpl.createdAt||0);console.log(created>=Number(process.env.MIN_CREATED)?dpl.url:'')}catch(e){console.log('')}})")
            if [ -n "$DEPLOY_URL" ]; then
              echo "New deployment ready: https://$DEPLOY_URL"
              break
            fi
            echo "  ...waiting for deploy ($i/96)"
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "No new deployment became ready within 24 minutes — skipping domain update."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest --silent

          for DOMAIN in protocolbanks.com www.protocolbanks.com; do
            echo "Pointing $DOMAIN -> $DEPLOY_URL"
            npx vercel alias set "https://$DEPLOY_URL" "$DOMAIN"
          done

          echo "Done. protocolbanks.com now serves https://$DEPLOY_URL"
