name: Point production domains to latest deployment

on:
  push:
    branches: [main]

jobs:
  point-domains:
    name: Re-point protocolbanks.com to the newest deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the new deployment and alias the domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_Da058QFCURMp71dIUxVaCVBXSjNX
        run: |
          set -euo pipefail
          START_MS=$(date +%s%3N)
          # Vercel may create the deployment a few seconds before this action
          # starts (Vercel gets the push first). Use a 1-minute grace window so
          # we catch this push's deployment without aliasing to an older one.
          FROM_MS=$((START_MS - 60000))

          echo "Polling Vercel for a production (READY) deployment created after this action started..."
          DEPLOY_URL=""
          for i in $(seq 1 96); do
            sleep 15
            # from=FROM_MS => only deployments created after this action
            # started (minus 1-min grace). This avoids any reliance on response
            # ordering and never aliases to a stale deployment from an earlier
            # push.
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&state=READY&from=$FROM_MS&limit=1")
            # Take the first deployment from the filtered result; it is
            # READY, production, and was created after we started.
            DEPLOY_URL=$(echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const dpl=(j.deployments||[])[0];console.log(dpl?dpl.url:'')}catch(e){console.log('')}})")
            if [ -n "$DEPLOY_URL" ]; then
              echo "New deployment ready: https://$DEPLOY_URL"
              break
            fi
            echo "  ...waiting for deploy ($i/96)"
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "No new deployment became ready within 24 minutes — skipping domain update."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest --silent

          for DOMAIN in protocolbanks.com www.protocolbanks.com; do
            echo "Pointing $DOMAIN -> $DEPLOY_URL"
            npx vercel alias set "https://$DEPLOY_URL" "$DOMAIN"
          done

          echo "Done. protocolbanks.com now serves https://$DEPLOY_URL"
