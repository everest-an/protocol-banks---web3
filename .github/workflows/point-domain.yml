name: Point production domains to latest deployment

on:
  push:
    branches: [main]

jobs:
  point-domains:
    name: Re-point protocolbanks.com to the newest deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the new deployment and alias the domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_Da058QFCURMp71dIUxVaCVBXSjNX
        run: |
          set -euo pipefail
          START_MS=$(date +%s%3N)
          # Vercel may create the deployment a few seconds before this action
          # starts; allow a 1-minute grace window.
          MIN_CREATED=$((START_MS - 60000))

          echo "Polling Vercel for the newest production (READY) deployment..."
          DEPLOY_URL=""
          for i in $(seq 1 96); do
            sleep 15
            # Pull up to 20 READY production deployments and pick the one with
            # the greatest createdAt in JS — no reliance on response ordering.
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&state=READY&limit=20")
            # DEBUG: echo the raw response on the first poll so we can see
            # whether the API is returning data or an error (invalid token etc.)
            if [ "$i" -eq 1 ]; then
              echo "DEBUG raw response (first 600 chars): ${RESP:0:600}"
            fi
            DEPLOY_URL=$(echo "$RESP" | MIN_CREATED="$MIN_CREATED" node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const list=j.deployments||[];list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const dpl=list[0];if(!dpl)return console.log('');const created=Number(dpl.createdAt||0);console.log(created>=Number(process.env.MIN_CREATED)?dpl.url:'')}catch(e){console.log('')}})")
            if [ -n "$DEPLOY_URL" ]; then
              echo "New deployment ready: https://$DEPLOY_URL"
              break
            fi
            echo "  ...waiting for deploy ($i/96)"
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "No new deployment became ready within 24 minutes — skipping domain update."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest --silent

          for DOMAIN in protocolbanks.com www.protocolbanks.com; do
            echo "Pointing $DOMAIN -> $DEPLOY_URL"
            npx vercel alias set "https://$DEPLOY_URL" "$DOMAIN"
          done

          echo "Done. protocolbanks.com now serves https://$DEPLOY_URL"
